<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои сайты</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        h1 {
            color: #333;
            margin-bottom: 40px;
        }

        .site-button {
            display: block;
            width: 280px;
            padding: 15px 20px;
            margin: 10px 0;
            background-color: #007bff; /* Синий цвет */
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .site-button:hover {
            background-color: #0056b3; 
            transform: translateY(-3px); 
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

       
    </style>
</head>
<body>

    <h1>Выберите сайт для перехода</h1>

    
    <a href="index copy.html" class="site-button" target="_blank">Мой первый сайт</a>
    
    <a href="index 2.html" class="site-button" target="_blank">Мой второй сайт</a>
    
    <a href="index 4.html" class="site-button" target="_blank">Мой третий сайт</a>

</body>
</html>
