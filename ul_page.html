<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тег ul</title>
</head>
<body>
    <h1>Описание тега &lt;ul&gt;</h1>
    <p>Тег <code>&lt;ul&gt;</code> (unordered list) используется для создания маркированного (неупорядоченного) списка. 
    Каждый отдельный элемент списка задается с помощью вложенного тега <code>&lt;li&gt;</code>.</p>

    <h2>Пример использования (Список покупок):</h2>
    <ul>
        <li>Хлеб</li>
        <li>Молоко</li>
        <li>Яблоки</li>
        <li>Сыр</li>
        <li>Кофе</li>
    </ul>

    <br>
    <!-- Кнопка возврата -->
    <form action="index.html">
        <button type="submit">Вернуться на главную</button>
    </form>
</body>
</html>
