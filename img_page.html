<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тег img</title>
</head>
<body>
    <h1>Описание тега &lt;img&gt;</h1>
    <p>Тег <code>&lt;img&gt;</code> предназначен для добавления изображений на веб-страницу. 
    Он является одиночным (пустым) тегом и использует обязательный атрибут <code>src</code> для указания пути к файлу изображения.</p>

    <h2>Пример использования (Тема: Природа)</h2>
    
    <img src="image1.png" alt="Лес" width="300">
    <br><br>
    <img src="image2.png" alt="Горы" width="300">
    <br><br>
    <img src="image3.png" alt="Река" width="300">

    <br><br>
    <!-- Кнопка возврата -->
    <form action="index.html">
        <button type="submit">Вернуться на главную</button>
    </form>
</body>
</html>
