<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 5. Изменение заголовка title -->
    <title>Главная</title>
    
    <!-- 6. Иконка страницы (favicon) рядом с названием -->
    <!-- Замените 'icon.png' на название вашей скачанной картинки с flaticon.com -->
    <link rel="icon" href="icon.png">
    
    <!-- 11. Подключение CSS файла -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 7. Тег div, выступающий в качестве поля меню (задаем id) -->
    <div id="menu">
        
        <!-- 8. Первая форма с уникальным id и action (ссылка) -->
        <form id="form1" action="https://www.google.com" target="_blank">
            <!-- 9. Кнопка с общим классом -->
            <button type="submit" class="btn">
                <!-- 10. Тег p для текста с общим классом -->
                <p class="btn-text">Google</p>
            </button>
        </form>

        <!-- 8. Вторая форма -->
        <form id="form2" action="https://www.youtube.com" target="_blank">
            <button type="submit" class="btn">
                <p class="btn-text">YouTube</p>
            </button>
        </form>

        <!-- 8. Третья форма -->
        <form id="form3" action="https://github.com" target="_blank">
            <button type="submit" class="btn">
                <p class="btn-text">GitHub</p>
            </button>
        </form>

    </div>

</body>
</html>
