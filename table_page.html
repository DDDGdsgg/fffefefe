<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Таблица фигур</title>
</head>
<body>
    <h1>Таблица 3х2 (Названия и картинки фигур)</h1>
    
    <table border="1" cellpadding="10" cellspacing="0">
        <!-- 1 строчка - названия фигур -->
        <tr>
            <td>Круг</td>
            <td>Квадрат</td>
            <td>Треугольник</td>
        </tr>
        <!-- 2 строчка - картинки фигур -->
        <tr>
            <td><img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><circle cx='50' cy='50' r='40' fill='blue'/></svg>" alt="Круг"></td>
            <td><img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><rect x='10' y='10' width='80' height='80' fill='red'/></svg>" alt="Квадрат"></td>
            <td><img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100'><polygon points='50,10 90,90 10,90' fill='green'/></svg>" alt="Треугольник"></td>
        </tr>
    </table>

    <br><br>
    <!-- Кнопка возврата -->
    <form action="index.html">
        <button type="submit">Вернуться на главную</button>
    </form>
</body>
</html>
